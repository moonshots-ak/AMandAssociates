<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — AMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <style>
    .not-found-section {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--primary-light) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1rem;
    }
    .not-found-num {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 700;
      line-height: 1;
      color: rgba(201,168,76,0.2);
      letter-spacing: 10px;
      display: block;
    }
  </style>
</head>
<body>

  <section class="not-found-section">
    <div>
      <span class="not-found-num">404</span>
      <h1 style="color:#fff; margin-top:-1rem;">Page Not Found</h1>
      <p style="color:rgba(255,255,255,0.55); max-width:420px; margin:1rem auto 2.5rem;">
        The page you are looking for does not exist or may have been moved.
      </p>
      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="index.html" class="btn-ama btn-ama-gold">
          <i class="fas fa-home me-2"></i> Back to Home
        </a>
        <a href="contact.html" class="btn-ama btn-ama-outline-white">Contact Us</a>
      </div>
      <div class="mt-4" style="font-size:0.75rem; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.55);">
        Akshay Maheshwari &amp; Associates &mdash; Chartered Accountants
      </div>
    </div>
  </section>

</body>
</html>
